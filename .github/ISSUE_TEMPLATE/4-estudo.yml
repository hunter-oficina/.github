name: Estudo
description: Pergunta que precisa ser respondida antes de decidir ou executar o trabalho.
type: Estudo
projects: ["hunter-oficina/1"]
body:
  - type: markdown
    attributes:
      value: "Título: a pergunta. Exemplo, \"Qual convenção de nomes usamos nos campos da API?\". O estudo termina com a decisão registrada."
  - type: textarea
    id: contexto
    attributes:
      label: Motivação e contexto
      description: Que decisão ou trabalho depende desta resposta?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas conhecidas
  - type: textarea
    id: entrega
    attributes:
      label: O que o estudo entrega
      placeholder: Uma recomendação, um ADR, um protótipo...
    validations:
      required: true
  - type: dropdown
    id: origem
    attributes:
      label: Origem
      options:
        - Suporte
        - Solicitação nova
    validations:
      required: true
  - type: dropdown
    id: criticidade
    attributes:
      label: Criticidade
      description: "Crítica: operação parada ou risco de perda de dados, segurança ou faturamento, sem alternativa. Alta: parte importante parada, alternativa limitada. Baixa: impacto pequeno ou com alternativa simples."
      options:
        - Crítica
        - Alta
        - Baixa
    validations:
      required: true
  - type: input
    id: chamado
    attributes:
      label: Chamado de suporte
      description: Só o número, se vier do suporte. Exemplo, Chamado #1234.
  - type: checkboxes
    id: privacidade
    attributes:
      label: Dados de cliente
      options:
        - label: Esta issue não tem nome, placa, CPF, CNPJ, telefone, e-mail nem print com dados de cliente.
          required: true
